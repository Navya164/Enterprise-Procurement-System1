<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - User Authentication</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h2>User Login</h2>


    <!-- Registration success message -->
    <div class="success"
         th:if="${registrationSuccess}"
         th:text="${registrationSuccess}">
    </div>


    <form th:action="@{/login}" method="post">


        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input 
                type="email"
                id="email"
                name="username"
                placeholder="Enter your email"
                required>

        </div>



        <!-- Password -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input 
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

        </div>



        <!-- Login error -->
        <div class="error"
             th:if="${param.error}">
             
             Invalid email or password

        </div>



        <!-- Logout message -->
        <div class="success"
             th:if="${param.logout}">
             
             You have been logged out successfully

        </div>



        <button type="submit">
            Login
        </button>


    </form>



    <div class="links">

        <a th:href="@{/register}">
            Create new account
        </a>


        <a th:href="@{/}">
            Home
        </a>

    </div>


</div>

</body>

</html>
